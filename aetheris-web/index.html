<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aetheris — Live Telemetry</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <h1 class="title">Aetheris Live Telemetry</h1>
        <p class="subtitle">Streaming telemetry from the Aetheris API</p>
      </div>
      <div class="status-area">
        <div id="last-updated" class="last-updated">Waiting for telemetry…</div>
        <div id="status-indicator" class="indicator disconnected">Disconnected</div>
      </div>
    </header>

    <section class="cards">
      <article class="card">
        <div class="card-head"><svg class="icon" viewBox="0 0 24 24" aria-hidden>
            <path d="M12 2 L20 8 V16 L12 22 L4 16 V8 Z" fill="currentColor" />
          </svg><span class="label">Sensor</span></div>
        <div id="sensor" class="card-value">—</div>
      </article>

      <article class="card">
        <div class="card-head"><svg class="icon" viewBox="0 0 24 24" aria-hidden>
            <path d="M12 3 L2 9 L12 15 L22 9 Z" fill="currentColor" />
          </svg><span class="label">Value</span></div>
        <div id="value" class="card-value">—</div>
      </article>

      <article class="card">
        <div class="card-head"><svg class="icon" viewBox="0 0 24 24" aria-hidden>
            <path d="M1 21h22L12 2 1 21z" fill="currentColor" />
          </svg><span class="label">Severity</span></div>
        <div id="severity" class="card-value severity-normal">—</div>
      </article>

      <article class="card explanation">
        <div class="card-head"><svg class="icon" viewBox="0 0 24 24" aria-hidden>
            <path
              d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm1.1-7.75c-.2.52-.7 1.03-1.4 1.48-.8.5-1.3.92-1.3 1.92v.35h-2v-.5c0-1.25.68-2 1.6-2.6.85-.56 1.5-1.1 1.7-1.73.2-.66.05-1.4-.46-1.93-.6-.62-1.6-.77-2.3-.3-.41.28-.66.7-.66 1.17H7.5c0-.93.47-1.8 1.25-2.36C10 4.07 11.46 3.7 12.95 4.07c1.6.41 2.87 1.84 2.25 4.18z"
              fill="currentColor" />
          </svg><span class="label">Explanation</span></div>
        <div id="explanation" class="explanation-text">—</div>
      </article>
    </section>

    <section class="chart-panel">
      <div class="chart-head">
        <div class="chart-title">Battery Temp (last 30 points)</div>
        <div class="chart-legend"><span id="min-val" class="mini">—</span> <span id="max-val" class="mini">—</span>
        </div>
      </div>
      <canvas id="sparkline" width="800" height="160" class="sparkline"></canvas>
    </section>
  </main>

  <script src="./app.js"></script>
</body>

</html>
