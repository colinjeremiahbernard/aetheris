version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aetheris-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aetheris
      POSTGRES_PASSWORD: aetheris_pass
      POSTGRES_DB: aetheris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris -d aetheris"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
